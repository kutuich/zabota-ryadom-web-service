services:
  postgres-rehearsal:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: zabota_local
      POSTGRES_PASSWORD: zabota_local_only
      POSTGRES_DB: zabota_rehearsal
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabota_local -d zabota_rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - zabota-postgres-rehearsal-data:/var/lib/postgresql/data
      - ./scripts/postgres/init-rehearsal-databases.sql:/docker-entrypoint-initdb.d/01-create-test-databases.sql:ro
    restart: unless-stopped

volumes:
  zabota-postgres-rehearsal-data:
