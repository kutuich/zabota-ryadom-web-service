services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - zabota-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migration
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      target: runner
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-4000}:4000"
    volumes:
      - ${ZABOTA_DATA_PATH:-./.local-data/production}:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  zabota-postgres-data:
