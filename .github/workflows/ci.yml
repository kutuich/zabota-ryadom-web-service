name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 22 / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://zabota_ci:zabota_ci_only@127.0.0.1:5432/zabota_ci?schema=public
      TEST_DATABASE_URL: postgresql://zabota_ci:zabota_ci_only@127.0.0.1:5432/zabota_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      PAYMENT_PROVIDER: mock
      TBANK_TERMINAL_MODE: test
      OAUTH_ENABLED: "false"
      VK_ID_ENABLED: "false"
      STORAGE_PROVIDER: local
      UPLOADS_DIR: /tmp/zabota-ci-uploads

    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: zabota_ci
          POSTGRES_USER: zabota_ci
          POSTGRES_PASSWORD: zabota_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zabota_ci -d zabota_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run db:generate

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:migrate:deploy

      - name: Seed test fixtures
        run: npm run db:seed

      - name: Static checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Regression and contract tests
        run: npm test

      - name: Generate OpenAPI artifact
        run: npm run api:openapi && test -s backend/generated/openapi.json

      - name: Enforce production dependency audit baseline
        run: npm run security:audit-ci

      - name: Check patch whitespace
        run: git diff --check

  docker-images:
    name: Docker targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migration
          push: false
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Build and load runner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: zabota-ci-runner:stage9
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Verify migration CLI is absent from runner
        run: >-
          docker run --rm --entrypoint node zabota-ci-runner:stage9
          -e "for (const name of ['prisma', '@prisma/config', 'deepmerge-ts']) {
          try { require.resolve(name); process.exit(1); } catch (error) {
          if (error.code !== 'MODULE_NOT_FOUND') throw error; } }"
